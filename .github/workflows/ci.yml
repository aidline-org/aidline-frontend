name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_AIDLINE_CONTRACT_ID: CALNXTTPKPTCCWSTN3NHQNZHPXM2IXQZQMFBCCK7LI3N5FRB6DB5NLHK
      - name: Run automated accessibility checks (axe)
        run: |
          npx next start &
          npx wait-on http://localhost:3000
          npx @axe-core/cli http://localhost:3000 http://localhost:3000/campaigns http://localhost:3000/verifiers http://localhost:3000/how-it-works http://localhost:3000/start --exit --threshold 1
        env:
          NEXT_PUBLIC_AIDLINE_CONTRACT_ID: CALNXTTPKPTCCWSTN3NHQNZHPXM2IXQZQMFBCCK7LI3N5FRB6DB5NLHK


